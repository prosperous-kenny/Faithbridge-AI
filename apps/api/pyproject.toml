[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithbridge-api"
version = "0.1.0"
description = "FaithBridge AI core API: auth, assistance, donations, dashboards"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  # pydantic.EmailStr (used by the notification routes) raises at import time
  # without this; it was previously only present in a local venv, so a clean
  # `pip install -e .[dev]` failed to collect the test suite.
  "email-validator>=2.2",
  "httpx>=0.27",
  # JWT signing and verification (Phase 1 auth). Pure-Python, no compiled
  # dependencies, so a clean install stays reproducible.
  # The [crypto] extra pulls in `cryptography`, which is required for RS256:
  # AUTH_MODE=oidc is the only mode allowed in production, and it verifies
  # Keycloak's signature with that algorithm.
  "pyjwt[crypto]>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # Phase 5 observability: Prometheus export and opt-in Sentry error tracking.
  "prometheus-client>=0.20",
  "sentry-sdk>=2.0",
]

[project.optional-dependencies]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `tests.*` imports resolvable for every invocation style (bare pytest,
# python -m pytest, CI), not just those that put cwd on sys.path.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"