[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithbridge-ai"
version = "0.1.0"
description = "FaithBridge AI service: need classification, urgency scoring, and donor matching"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["faithbridge_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]