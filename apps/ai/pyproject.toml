[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithbridge-ai"
version = "0.1.0"
description = "FaithBridge AI service: need classification, urgency scoring, and donor matching"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  # Baseline model. Small, fast, and imported at module load by baseline.py and
  # calibration.py, so it has to be a runtime dependency, not an extra: the
  # Vercel Python runtime installs only [project].dependencies, and a missing
  # scikit-learn would fail the function at import time.
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Embedding model comparison (docs/adr/0001-model-selection.md). Not adopted
# for the default path: pulls torch (~2GB) and must stay optional so CI does not
# download it. Install explicitly with `pip install -e ".[embeddings]"`.
embeddings = ["sentence-transformers>=3"]
# ruff is installed here too: CI runs `ruff check .` after `pip install -e ".[dev]"`.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["faithbridge_ai*"]

# Vercel Python runtime: the FastAPI app lives in a package directory, which is
# not one of the default entrypoint locations, so name it explicitly.
[tool.vercel]
entrypoint = "faithbridge_ai.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]