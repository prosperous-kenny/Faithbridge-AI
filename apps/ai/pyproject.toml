[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithbridge-ai"
version = "0.1.0"
description = "FaithBridge AI service: need classification, urgency scoring, and donor matching"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Baseline model. Small, fast, installed by default.
ml = ["scikit-learn>=1.5"]
# Embedding model comparison (docs/adr/0001-model-selection.md). Not adopted
# for the default path: pulls torch (~2GB) and must stay optional so CI does not
# download it. Install explicitly with `pip install -e ".[embeddings]"`.
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["faithbridge_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]