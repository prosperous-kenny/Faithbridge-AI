services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faithbridge
      POSTGRES_PASSWORD: faithbridge
      POSTGRES_DB: faithbridge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Phase 1 identity provider. Only used when the API runs with
  # AUTH_MODE=oidc; development and the test suite use AUTH_MODE=local and do
  # not need this service at all.
  #
  # NOT VERIFIED in this repository's environment: the machine the Phase 1
  # work was done on has no Docker and no JVM, so this compose file and the
  # realm import have never been started. Treat them as unexecuted
  # configuration until they have booted once on a machine with Docker — see
  # docs/IMPLEMENTATION_PLAN.md, Phase 1 exit gate.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Development-only bootstrap credentials for the Keycloak admin console
      # (http://localhost:8180). Never carry these into a deployed environment.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data/h2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  db_data:
  keycloak_data:
