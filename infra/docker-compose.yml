services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faithbridge
      POSTGRES_PASSWORD: faithbridge
      POSTGRES_DB: faithbridge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data: