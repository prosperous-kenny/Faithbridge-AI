# FaithBridge AI — Netlify configuration
#
# SCOPE: this deploys the Next.js frontend only (apps/web).
# The Python services (apps/api, apps/ai) and PostgreSQL are NOT deployed here,
# because Netlify functions cannot host long-running FastAPI servers or a
# Postgres instance. Until the API is hosted elsewhere, the /dashboard and
# /status pages will report the backend as unavailable. That is expected.
#
# NOTE: no `publish` directory is set on purpose. Netlify's OpenNext adapter
# provisions the serverless functions itself for Next.js, so an explicit
# publish path conflicts with the build. If a publish directory is set in the
# Netlify UI it overrides this and must be cleared.

[build]
  base = "apps/web"
  command = "npm run build"
  # The Netlify UI has this pinned to "apps/web", which equals the base
  # directory and makes the OpenNext adapter abort with
  # "publish directory cannot be the same as the base directory".
  # The UI field cannot be cleared, so override it here: netlify.toml takes
  # precedence over UI build settings.
  publish = ".next"

# REQUIRED: provisions the serverless functions for the server-rendered routes
# (/dashboard, /status, /api/assistance). Without it the build succeeds but
# deploys 0 functions and every route 404s. Next.js is not auto-detected here
# because explicit build settings in a monorepo bypass framework detection.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Server-side only. Points the frontend at wherever the FastAPI API is hosted.
# Leave unset so it falls back to localhost:8000 and the status page explains
# that no backend is connected, rather than appearing broken.
# API_URL = "https://your-api-host.example.com"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "next"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
