# FaithBridge AI — Netlify configuration
#
# SCOPE: this deploys the Next.js frontend only (apps/web).
# The Python services (apps/api, apps/ai) and PostgreSQL are NOT deployed here,
# because Netlify functions cannot host long-running FastAPI servers or a
# Postgres instance. Until the API is hosted elsewhere, the /dashboard and
# /status pages will report the backend as unavailable. That is expected.
#
# NOTE: no `publish` directory is set on purpose. Netlify's OpenNext adapter
# provisions the serverless functions itself for Next.js, so an explicit
# publish path conflicts with the build. If a publish directory is set in the
# Netlify UI it overrides this and must be cleared.

[build]
  base = "apps/web"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Server-side only. Points the frontend at wherever the FastAPI API is hosted.
# Leave unset so it falls back to localhost:8000 and the status page explains
# that no backend is connected, rather than appearing broken.
# API_URL = "https://your-api-host.example.com"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "next"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
